<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LifeSim</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  background:#0b1020;
  color:white;
  font-family:Arial,sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
}

.container{
  width:92%;
  max-width:520px;
  text-align:center;
  padding:25px 15px;
}

.logo{
  font-size:52px;
  font-weight:bold;
  margin-bottom:8px;
}

.tagline{
  color:#aab3c7;
  margin-bottom:35px;
}

.card{
  background:#151c30;
  border:1px solid #293450;
  border-radius:22px;
  padding:28px 20px;
}

h2{
  margin-top:0;
}

.description{
  color:#9da7bd;
  line-height:1.6;
}

button{
  width:100%;
  padding:15px;
  margin-top:20px;
  border:0;
  border-radius:12px;
  background:white;
  color:#0b1020;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

input,
select{
  width:100%;
  padding:14px;
  margin-top:12px;
  border-radius:10px;
  border:1px solid #303b59;
  background:#0f1628;
  color:white;
  font-size:16px;
  outline:none;
}

input:focus,
select:focus{
  border-color:#667eea;
}

.features{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-top:20px;
}

.feature{
  background:#10172a;
  border-radius:12px;
  padding:13px 4px;
  font-size:13px;
  color:#c5ccda;
}

.icon{
  display:block;
  font-size:22px;
  margin-bottom:6px;
}

.footer{
  margin-top:22px;
  color:#667087;
  font-size:12px;
}

.back{
  background:#252e45;
  color:white;
}

.smallButton{
  background:#252e45;
  color:white;
  font-size:14px;
  padding:12px;
}

.message{
  margin-top:15px;
  color:#aab3c7;
  font-size:14px;
  line-height:1.5;
}

.error{
  color:#ff8c8c;
}

.success{
  color:#7ee2a8;
}

.statBox{
  background:#10172a;
  border-radius:14px;
  padding:16px 5px;
}

.statValue{
  font-size:18px;
  font-weight:bold;
  margin-top:5px;
}

.loading{
  opacity:.7;
}

</style>

</head>

<body>

<div class="container">

  <div class="logo">
    LifeSim
  </div>

  <div class="tagline">
    Your Life. Your Choices.
  </div>

  <div class="card" id="gameCard">

    <h2>
      Welcome to LifeSim
    </h2>

    <p class="description">
      Build your own virtual life,
      make decisions, start a career,
      build a business and compete
      with players around the world.
    </p>

    <button onclick="showAuth('signup')">
      🚀 Start Your Life
    </button>

    <button class="back" onclick="showAuth('login')">
      🔐 Login
    </button>

    <div class="features">

      <div class="feature">
        <span class="icon">👤</span>
        Create
      </div>

      <div class="feature">
        <span class="icon">💰</span>
        Earn
      </div>

      <div class="feature">
        <span class="icon">🌍</span>
        Compete
      </div>

    </div>

  </div>

  <div class="footer">
    LifeSim • Virtual Life Simulator
  </div>

</div>


<!-- Supabase -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
  "https://gkhbsqihmktxfewdvytg.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_mCmmD_Z-08BjfDNWfeY9AA_Wc9WxgAQ";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


/* =========================================================
   GLOBAL DATA
========================================================= */

let currentUser = null;
let currentPlayer = null;


/* =========================================================
   START
========================================================= */

document.addEventListener("DOMContentLoaded", async function(){

  const {
    data: {
      session
    }
  } = await supabaseClient.auth.getSession();

  if(session){

    currentUser = session.user;

    await loadPlayer();

  }

});


/* =========================================================
   HOME
========================================================= */

function showHome(){

  document.getElementById("gameCard").innerHTML = `

    <h2>
      Welcome to LifeSim
    </h2>

    <p class="description">
      Build your own virtual life,
      make decisions, start a career,
      build a business and compete
      with players around the world.
    </p>

    <button onclick="showAuth('signup')">
      🚀 Start Your Life
    </button>

    <button class="back" onclick="showAuth('login')">
      🔐 Login
    </button>

    <div class="features">

      <div class="feature">
        <span class="icon">👤</span>
        Create
      </div>

      <div class="feature">
        <span class="icon">💰</span>
        Earn
      </div>

      <div class="feature">
        <span class="icon">🌍</span>
        Compete
      </div>

    </div>

  `;

}


/* =========================================================
   AUTH SCREEN
========================================================= */

function showAuth(mode){

  const isSignup =
    mode === "signup";

  document.getElementById("gameCard").innerHTML = `

    <h2>
      ${isSignup ? "🚀 Create Account" : "🔐 Login"}
    </h2>

    <p class="description">
      ${
        isSignup
        ? "Create your LifeSim account and start your virtual life."
        : "Login to continue your LifeSim journey."
      }
    </p>

    <input
      id="authEmail"
      type="email"
      placeholder="Email address"
      autocomplete="email"
    >

    <input
      id="authPassword"
      type="password"
      placeholder="Password"
      autocomplete="${isSignup ? "new-password" : "current-password"}"
    >

    <button
      id="authButton"
      onclick="${isSignup ? "signup()" : "login()"}"
    >
      ${isSignup ? "✨ Create Account" : "🔓 Login"}
    </button>

    <div
      id="authMessage"
      class="message"
    ></div>

    <button
      class="back"
      onclick="${isSignup ? "showAuth('login')" : "showHome()"}"
    >
      ← ${isSignup ? "Already have an account? Login" : "Back"}
    </button>

  `;

}


/* =========================================================
   SIGN UP
========================================================= */

async function signup(){

  const email =
    document.getElementById("authEmail").value
      .trim();

  const password =
    document.getElementById("authPassword").value;

  const message =
    document.getElementById("authMessage");

  const button =
    document.getElementById("authButton");


  if(!email || !password){

    message.className =
      "message error";

    message.textContent =
      "Please enter your email and password.";

    return;
  }


  if(password.length < 6){

    message.className =
      "message error";

    message.textContent =
      "Password must be at least 6 characters.";

    return;
  }


  button.disabled = true;

  button.textContent =
    "Creating account...";


  const {
    data,
    error
  } = await supabaseClient.auth.signUp({

    email: email,

    password: password

  });


  if(error){

    button.disabled = false;

    button.textContent =
      "✨ Create Account";

    message.className =
      "message error";

    message.textContent =
      error.message;

    return;
  }


  if(data.user){

    currentUser =
      data.user;

    message.className =
      "message success";

    message.textContent =
      "Account created successfully!";


    setTimeout(function(){

      showCharacter();

    },500);

  }

}


/* =========================================================
   LOGIN
========================================================= */

async function login(){

  const email =
    document.getElementById("authEmail").value
      .trim();

  const password =
    document.getElementById("authPassword").value;

  const message =
    document.getElementById("authMessage");

  const button =
    document.getElementById("authButton");


  if(!email || !password){

    message.className =
      "message error";

    message.textContent =
      "Please enter your email and password.";

    return;
  }


  button.disabled = true;

  button.textContent =
    "Logging in...";


  const {
    data,
    error
  } =
    await supabaseClient.auth.signInWithPassword({

      email: email,

      password: password

    });


  if(error){

    button.disabled = false;

    button.textContent =
      "🔓 Login";

    message.className =
      "message error";

    message.textContent =
      error.message;

    return;
  }


  currentUser =
    data.user;


  await loadPlayer();

}


/* =========================================================
   CHARACTER CREATION
========================================================= */

function showCharacter(){

  document.getElementById("gameCard").innerHTML = `

    <h2>
      👤 Create Your Character
    </h2>

    <p class="description">
      This is the beginning of your new life.
    </p>

    <input
      id="playerName"
      type="text"
      placeholder="Your name"
      maxlength="20"
    >

    <input
      id="playerAge"
      type="number"
      placeholder="Your age"
      min="13"
      max="100"
    >

    <input
      id="playerCity"
      type="text"
      placeholder="Your city"
      maxlength="30"
    >

    <select id="playerGoal">

      <option value="">
        Choose your life goal
      </option>

      <option value="business">
        💼 Become a Business Owner
      </option>

      <option value="career">
        🎓 Build a Great Career
      </option>

      <option value="wealth">
        💰 Become Rich
      </option>

      <option value="fame">
        ⭐ Become Famous
      </option>

    </select>

    <button
      id="createButton"
      onclick="createCharacter()"
    >
      ✨ Create Character
    </button>

    <div
      id="characterMessage"
      class="message"
    ></div>

    <button
      class="back"
      onclick="logout()"
    >
      🚪 Logout
    </button>

  `;

}


/* =========================================================
   CREATE CHARACTER + SAVE TO SUPABASE
========================================================= */

async function createCharacter(){

  if(!currentUser){

    alert("Please login first.");

    showAuth("login");

    return;
  }


  const name =
    document.getElementById("playerName")
      .value.trim();

  const age =
    parseInt(
      document.getElementById("playerAge")
        .value
    );

  const city =
    document.getElementById("playerCity")
      .value.trim();

  const goal =
    document.getElementById("playerGoal")
      .value;


  const message =
    document.getElementById("characterMessage");

  const button =
    document.getElementById("createButton");


  if(!name || !age || !city || !goal){

    message.className =
      "message error";

    message.textContent =
      "Please complete all fields.";

    return;
  }


  if(age < 13 || age > 100){

    message.className =
      "message error";

    message.textContent =
      "Age must be between 13 and 100.";

    return;
  }


  button.disabled = true;

  button.textContent =
    "Saving your life...";


  const {
    data,
    error
  } =
    await supabaseClient
      .from("players")
      .insert({

        id: currentUser.id,

        name: name,

        age: age,

        city: city,

        goal: goal

      })
      .select()
      .single();


  if(error){

    button.disabled = false;

    button.textContent =
      "✨ Create Character";


    if(error.code === "23505"){

      message.className =
        "message error";

      message.textContent =
        "This account already has a character.";

      await loadPlayer();

      return;

    }


    message.className =
      "message error";

    message.textContent =
      error.message;

    return;
  }


  currentPlayer =
    data;


  showWelcome();

}


/* =========================================================
   LOAD PLAYER FROM SUPABASE
========================================================= */

async function loadPlayer(){

  if(!currentUser){

    return;
  }


  const {
    data,
    error
  } =
    await supabaseClient
      .from("players")
      .select("*")
      .eq("id", currentUser.id)
      .maybeSingle();


  if(error){

    console.error(
      "Player load error:",
      error
    );

    return;
  }


  if(data){

    currentPlayer =
      data;

    showWelcome();

  }else{

    showCharacter();

  }

}


/* =========================================================
   WELCOME
========================================================= */

function showWelcome(){

  if(!currentPlayer){

    return;
  }


  const safeName =
    escapeHTML(currentPlayer.name);

  const safeCity =
    escapeHTML(currentPlayer.city);

  const safeAge =
    escapeHTML(String(currentPlayer.age));


  document.getElementById("gameCard").innerHTML = `

    <h2>
      🎉 Welcome, ${safeName}!
    </h2>

    <p class="description">
      Your LifeSim journey has begun.
    </p>

    <div class="features">

      <div class="feature">
        <span class="icon">🎂</span>
        Age<br>${safeAge}
      </div>

      <div class="feature">
        <span class="icon">📍</span>
        City<br>${safeCity}
      </div>

      <div class="feature">
        <span class="icon">💰</span>
        Money<br>$${Number(currentPlayer.money).toLocaleString()}
      </div>

    </div>

    <button onclick="enterWorld()">
      🌍 Enter Your World
    </button>

    <button
      class="back"
      onclick="logout()"
    >
      🚪 Logout
    </button>

  `;

}


/* =========================================================
   ENTER WORLD
========================================================= */

function enterWorld(){

  if(!currentPlayer){

    return;
  }


  document.getElementById("gameCard").innerHTML = `

    <h2>
      🌍 Your World
    </h2>

    <p class="description">
      Welcome to LifeSim.
      Your virtual life is ready.
    </p>

    <div class="features">

      <div class="statBox">
        <span class="icon">💰</span>
        Money
        <div class="statValue">
          $${Number(currentPlayer.money).toLocaleString()}
        </div>
      </div>

      <div class="statBox">
        <span class="icon">❤️</span>
        Happiness
        <div class="statValue">
          ${Number(currentPlayer.happiness)}%
        </div>
      </div>

      <div class="statBox">
        <span class="icon">⭐</span>
        Reputation
        <div class="statValue">
          ${Number(currentPlayer.reputation)}
        </div>
      </div>

    </div>

    <button onclick="careerComingSoon()">
      💼 Career
    </button>

    <button onclick="businessComingSoon()">
      🏢 Business
    </button>

    <button onclick="onlineComingSoon()">
      🌎 Online Players
    </button>

    <button
      class="back"
      onclick="showWelcome()"
    >
      ← Back
    </button>

    <button
      class="smallButton"
      onclick="logout()"
    >
      🚪 Logout
    </button>

  `;

}


/* =========================================================
   FUTURE SYSTEMS
========================================================= */

function careerComingSoon(){

  alert(
    "💼 Career system is coming next!"
  );

}


function businessComingSoon(){

  alert(
    "🏢 Business system is coming next!"
  );

}


function onlineComingSoon(){

  alert(
    "🌎 Online Players system is coming next!"
  );

}


/* =========================================================
   LOGOUT
========================================================= */

async function logout(){

  await supabaseClient.auth.signOut();

  currentUser =
    null;

  currentPlayer =
    null;

  showHome();

}


/* =========================================================
   HTML SAFETY
========================================================= */

function escapeHTML(value){

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}

</script>

</body>
</html>
