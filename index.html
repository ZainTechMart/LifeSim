<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>LifeSim - 3D Village</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- THREE.JS -->
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,
body{
  width:100%;
  height:100%;
}

body{
  font-family:Arial,sans-serif;
  background:#0f172a;
  color:#fff;
  min-height:100vh;
}

button{
  border:0;
  border-radius:10px;
  padding:12px 18px;
  cursor:pointer;
  font-size:15px;
  font-weight:bold;
}

input,
select{
  width:100%;
  padding:12px;
  margin:7px 0 12px;
  border:1px solid #334155;
  border-radius:9px;
  background:#1e293b;
  color:#fff;
  font-size:15px;
}

.container{
  width:100%;
  max-width:1100px;
  margin:auto;
  padding:20px;
}

.card{
  background:#1e293b;
  border-radius:16px;
  padding:20px;
  margin-bottom:18px;
  box-shadow:0 8px 25px rgba(0,0,0,.2);
}

.center{
  text-align:center;
}

.hidden{
  display:none !important;
}

.logo{
  font-size:38px;
  font-weight:bold;
}

.tagline{
  color:#94a3b8;
  margin-bottom:25px;
}

h2{
  margin-bottom:15px;
}

p{
  color:#cbd5e1;
  line-height:1.5;
}

.primary{
  background:#22c55e;
  color:#052e16;
}

.secondary{
  background:#3b82f6;
  color:#fff;
}

.danger{
  background:#ef4444;
  color:#fff;
}

.message{
  margin-top:12px;
  min-height:22px;
}

.success{
  color:#4ade80;
}

.error{
  color:#f87171;
}


/* =========================================================
   3D GAME
========================================================= */

#gameWorld{
  position:relative;
  width:100%;
  height:70vh;
  min-height:480px;
  overflow:hidden;
  border-radius:18px;
  background:#87ceeb;
  touch-action:none;
}

#gameCanvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  display:block;
}


/* TOP GAME UI */

.game-top-ui{
  position:absolute;
  top:12px;
  left:12px;
  right:12px;
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:10px;
  pointer-events:none;
}

.game-info{
  background:rgba(15,23,42,.78);
  backdrop-filter:blur(8px);
  padding:10px 14px;
  border-radius:12px;
  pointer-events:auto;
}

.game-info strong{
  color:#4ade80;
}

.exit-game{
  pointer-events:auto;
  background:rgba(239,68,68,.9);
  color:#fff;
}


/* MOBILE JOYSTICK */

#joystick{
  position:absolute;
  left:25px;
  bottom:25px;
  width:135px;
  height:135px;
  border-radius:50%;
  background:rgba(15,23,42,.35);
  border:2px solid rgba(255,255,255,.25);
  touch-action:none;
  user-select:none;
}

#joystickKnob{
  position:absolute;
  left:50%;
  top:50%;
  width:62px;
  height:62px;
  transform:translate(-50%,-50%);
  border-radius:50%;
  background:rgba(255,255,255,.75);
  box-shadow:0 5px 15px rgba(0,0,0,.3);
}


/* CAMERA BUTTONS */

.camera-buttons{
  position:absolute;
  right:20px;
  bottom:25px;
  display:flex;
  flex-direction:column;
  gap:10px;
}

.camera-buttons button{
  width:52px;
  height:52px;
  padding:0;
  border-radius:50%;
  background:rgba(15,23,42,.7);
  color:white;
  font-size:20px;
}


/* LOADING */

#worldLoading{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#0f172a;
  z-index:20;
}

.loading-box{
  text-align:center;
}

.loading-box h2{
  margin-bottom:10px;
}


/* DESKTOP HELP */

.controls-help{
  position:absolute;
  bottom:15px;
  left:50%;
  transform:translateX(-50%);
  background:rgba(15,23,42,.7);
  padding:8px 14px;
  border-radius:10px;
  font-size:13px;
  color:#cbd5e1;
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:700px){

  .container{
    padding:8px;
  }

  #gameWorld{
    height:calc(100vh - 16px);
    min-height:500px;
    border-radius:12px;
  }

  .controls-help{
    display:none;
  }

  .game-info{
    font-size:13px;
    padding:8px 10px;
  }

  .exit-game{
    padding:9px 12px;
    font-size:13px;
  }

}

</style>

</head>

<body>

<div class="container">


<!-- =====================================================
     LOGIN
===================================================== -->

<section id="loginScreen">

  <div class="card center">

    <div class="logo">
      LifeSim
    </div>

    <div class="tagline">
      Your Life. Your Choices.
    </div>

    <h2>Welcome</h2>

    <input
      id="loginEmail"
      type="email"
      placeholder="Email"
    >

    <input
      id="loginPassword"
      type="password"
      placeholder="Password"
    >

    <button
      class="primary"
      onclick="login()"

      Login

    <button
      class="secondary"

    </button>

    <div
      id="loginMessage"
      class="message"
    ></div>

  </div>

</section>


<!-- =====================================================
     SIGNUP
===================================================== -->

<section
  id="signupScreen"
  class="hidden"
>

  <div class="card center">

    <div class="logo">
      LifeSim
    </div>

    <div class="tagline">
      Start your virtual life.
    </div>

    <h2>Create Account</h2>

    <input
      id="signupEmail"
      type="email"

    >

    <input
      id="signupPassword"
      type="password"
      placeholder="Password"

    <button

<!-- =====================================================

===================================================== -->

<section

  class="hidden"
>

  <div class="card">

    <div class="center">

      <div class="logo">
        LifeSim
      </div>

      <p>
        Create your character and begin your village life.
      </p>

    <hr>

    <label>Name</label>

      <option>Islamabad</option>

    </select>

    <select id="playerGoal">

      <option>Become Rich</option>

    <div

<!-- =====================================================
     GAME
===================================================== -->

<section
  id="gameScreen"
  class="hidden"
>

  <div

  >

    <div id="worldLoading">

      <div class="loading-box">

        <h2>
          🌾 Loading Village...

          Preparing your world

      </div>

    </div>


    <canvas

    <!-- TOP UI -->

    <div class="game-top-ui">

      <div class="game-info">

        👤
        <strong id="worldPlayerName">
          Player
        </strong>

        💰
        $<span id="worldMoney">
          0

      </div>

      <button

        ☰ Menu
      </button>

    </div>


    <!-- JOYSTICK -->

    <div id="joystick">

      <div
        id="joystickKnob"
      ></div>

    </div>


    <!-- CAMERA -->

    <div class="camera-buttons">

      <button
        onclick="rotateCamera(-1)"

        ◀
      </button>

      <button
        onclick="resetCamera()"

        🎥
      </button>

</div>


<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
  "https://gkhbsqihmktxfewdvytg.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_mCmmD_Z-08BjfDNWfeY9AA_Wc9WxgAQ";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


/* =========================================================
   GLOBAL
========================================================= */

let currentPlayer = null;


/* =========================================================
   BASIC HELPERS
========================================================= */

function getElement(id){

  return document.getElementById(id);

}


function hideAllScreens(){

  getElement("loginScreen")
    .classList.add("hidden");

  getElement("signupScreen")
    .classList.add("hidden");

  getElement("characterScreen")
    .classList.add("hidden");

  getElement("gameScreen")
    .classList.add("hidden");

}


function showLogin(){

  hideAllScreens();

  getElement("loginScreen")
    .classList.remove("hidden");

}


function showSignup(){

  hideAllScreens();

  getElement("signupScreen")
    .classList.remove("hidden");

}


function showMessage(
  id,
  message,
  success=false
){

  const el =
    getElement(id);

  if(!el){
    return;
  }

  el.textContent =
    message;

  el.className =
    success
      ? "message success"
      : "message error";

}


/* =========================================================
   SIGNUP
========================================================= */

async function signup(){

  const email =
    getElement("signupEmail")
      .value
      .trim();

  const password =
    getElement("signupPassword")
      .value;

  if(!email || !password){

    showMessage(
      "signupMessage",
      "Email aur password enter karo."
    );

    return;

  }

  if(password.length < 6){

    showMessage(
      "signupMessage",
      "Password kam az kam 6 characters ka ho."
    );

    return;

  }

  showMessage(
    "signupMessage",
    "Account create ho raha hai...",
    true
  );

  const {
    error
  } =
    await supabaseClient.auth.signUp({

      email,
      password

    });

  if(error){

    showMessage(
      "signupMessage",
      error.message
    );

    return;

  }

  showMessage(
    "signupMessage",
    "Account create ho gaya. Ab login karo.",
    true
  );

}


/* =========================================================
   LOGIN
========================================================= */

async function login(){

  const email =
    getElement("loginEmail")
      .value
      .trim();

  const password =
    getElement("loginPassword")
      .value;

  if(!email || !password){

    showMessage(
      "loginMessage",
      "Email aur password enter karo."
    );

    return;

  }

  showMessage(
    "loginMessage",
    "Login ho raha hai...",
    true
  );

  const {
    error
  } =
    await supabaseClient.auth
      .signInWithPassword({

        email,
        password

      });

  if(error){

    showMessage(
      "loginMessage",
      error.message
    );

    return;

  }

  await loadPlayer();

}


/* =========================================================
   CURRENT USER
========================================================= */

async function getCurrentUser(){

  const {
    data,
    error
  } =
    await supabaseClient.auth.getUser();

  if(error){
    return null;
  }

  return data.user;

}


/* =========================================================
   CREATE CHARACTER
========================================================= */

async function createCharacter(){

  const user =
    await getCurrentUser();

  if(!user){

    showLogin();

    return;

  }

  const name =
    getElement("playerName")
      .value
      .trim();

  const age =
    parseInt(
      getElement("playerAge").value
    );

  const city =
    getElement("playerCity").value;

  const goal =
    getElement("playerGoal").value;


  if(!name){

    showMessage(
      "characterMessage",
      "Character name enter karo."
    );

    return;

  }


  if(
    !age ||
    age < 10 ||
    age > 100
  ){

    showMessage(
      "characterMessage",
      "Age 10 se 100 ke darmiyan honi chahiye."
    );

    return;

  }


  const playerData = {

    id:user.id,

    name:name,

    age:age,

    city:city,

    goal:goal,

    money:10000,

    happiness:70,

    reputation:10,

    career:"Unemployed",

    experience:0,

    career_level:1,

    business:"None",

    business_level:1,

    business_value:0,

    business_income:0

  };


  const {
    data,
    error
  } =
    await supabaseClient
      .from("players")
      .insert(playerData)
      .select()
      .single();


  if(error){

    showMessage(
      "characterMessage",
      error.message
    );

    return;

  }


  currentPlayer =
    data;


  showGame();

}


/* =========================================================
   LOAD PLAYER
========================================================= */

async function loadPlayer(){

  const user =
    await getCurrentUser();

  if(!user){

    showLogin();

    return;

  }


  const {
    data,
    error
  } =
    await supabaseClient
      .from("players")
      .select("*")
      .eq(
        "id",
        user.id
      )
      .maybeSingle();


  if(error){

    showMessage(
      "loginMessage",
      error.message
    );

    return;

  }


  if(!data){

    hideAllScreens();

    getElement("characterScreen")
      .classList.remove("hidden");

    return;

  }


  currentPlayer =
    data;


  showGame();

}


/* =========================================================
   SHOW GAME
========================================================= */

function showGame(){

  hideAllScreens();

  getElement("gameScreen")
    .classList.remove("hidden");


  getElement("worldPlayerName")
    .textContent =
    currentPlayer?.name || "Player";


  getElement("worldMoney")
    .textContent =
    Number(
      currentPlayer?.money || 0
    ).toLocaleString();


  startVillageWorld();

}


/* =========================================================
   EXIT WORLD
========================================================= */

function exitWorld(){

  /*
    Step 1 mein menu sirf world se bahar
    aane ke liye hai.
  */

  if(
    confirm(
      "Village se bahar nikal kar login screen par jana hai?"
    )
  ){

    logout();

  }

}


/* =========================================================
   LOGOUT
========================================================= */

async function logout(){

  await supabaseClient
    .auth
    .signOut();

  currentPlayer =
    null;

  stopVillageWorld();

  showLogin();

}


/* =========================================================
   THREE.JS VILLAGE WORLD
========================================================= */

let scene;

let camera;

let renderer;

let player;

let clock;

let animationFrame;

let worldStarted = false;

let cameraAngle = 0;

let joystickActive = false;

let joystickX = 0;

let joystickY = 0;

const keys = {};


/* =========================================================
   START WORLD
========================================================= */

function startVillageWorld(){

  if(worldStarted){

    updateWorldUI();

    return;

  }


  worldStarted = true;


  const canvas =
    getElement("gameCanvas");

  const world =
    getElement("gameWorld");


  scene =
    new THREE.Scene();


  scene.background =
    new THREE.Color(
      0x87ceeb
    );


  scene.fog =
    new THREE.Fog(
      0x87ceeb,
      40,
      180
    );


  camera =
    new THREE.PerspectiveCamera(
      60,
      world.clientWidth /
      world.clientHeight,
      0.1,
      500
    );


  renderer =
    new THREE.WebGLRenderer({

      canvas:canvas,

      antialias:true,

      powerPreference:
        "high-performance"

    });


  renderer.setPixelRatio(
    Math.min(
      window.devicePixelRatio,
      1.5
    )
  );


  renderer.setSize(
    world.clientWidth,
    world.clientHeight,
    false
  );


  renderer.shadowMap.enabled =
    true;


  clock =
    new THREE.Clock();


  createLighting();

  createGround();

  createRoads();

  createVillageHouses();

  createTrees();

  createFarms();

  createPlayer();

  createVillageDetails();

  setupKeyboard();

  setupJoystick();

  window.addEventListener(
    "resize",
    resizeWorld
  );


  getElement("worldLoading")
    .classList.add("hidden");


  updateWorldUI();

  animateWorld();

}


/* =========================================================
   LIGHTING
========================================================= */

function createLighting(){

  const ambient =
    new THREE.HemisphereLight(
      0xffffff,
      0x557755,
      2
    );

  scene.add(
    ambient
  );


  const sun =
    new THREE.DirectionalLight(
      0xffffff,
      2
    );


  sun.position.set(
    50,
    80,
    30
  );


  sun.castShadow =
    true;


  sun.shadow.mapSize.width =
    1024;

  sun.shadow.mapSize.height =
    1024;


  scene.add(
    sun
  );

}


/* =========================================================
   GROUND
========================================================= */

function createGround(){

  const geometry =
    new THREE.PlaneGeometry(
      220,
      220
    );


  const material =
    new THREE.MeshStandardMaterial({
      color:0x4f8f45
    });


  const ground =
    new THREE.Mesh(
      geometry,
      material
    );


  ground.rotation.x =
    -Math.PI / 2;


  ground.receiveShadow =
    true;


  scene.add(
    ground
  );

}


/* =========================================================
   ROAD
========================================================= */

function createRoad(
  x,
  z,
  width,
  depth
){

  const geometry =
    new THREE.BoxGeometry(
      width,
      0.08,
      depth
    );


  const material =
    new THREE.MeshStandardMaterial({
      color:0x555555
    });


  const road =
    new THREE.Mesh(
      geometry,
      material
    );


  road.position.set(
    x,
    0.04,
    z
  );


  scene.add(
    road
  );


  /*
    Road center line
  */

  const lineGeometry =
    new THREE.BoxGeometry(
      width > depth
        ? width
        : 0.12,

      0.1,

      width > depth
        ? 0.12
        : depth
    );


  const lineMaterial =
    new THREE.MeshBasicMaterial({
      color:0xffd84d
    });


  const line =
    new THREE.Mesh(
      lineGeometry,
      lineMaterial
    );


  line.position.set(
    x,
    0.1,
    z
  );


  scene.add(
    line
  );

}


function createRoads(){

  createRoad(
    0,
    0,
    220,
    8
  );


  createRoad(
    0,
    0,
    8,
    220
  );


  createRoad(
    0,
    35,
    120,
    5
  );


  createRoad(
    45,
    0,
    5,
    100
  );

}


/* =========================================================
   HOUSE
========================================================= */

function createHouse(
  x,
  z,
  color
){

  const group =
    new THREE.Group();


  /*
    House body
  */

  const bodyGeometry =
    new THREE.BoxGeometry(
      9,
      5,
      8
    );


  const bodyMaterial =
    new THREE.MeshStandardMaterial({
      color:color
    });


  const body =
    new THREE.Mesh(
      bodyGeometry,
      bodyMaterial
    );


  body.position.y =
    2.5;


  body.castShadow =
    true;


  body.receiveShadow =
    true;


  group.add(
    body
  );


  /*
    Roof
  */

  const roofGeometry =
    new THREE.ConeGeometry(
      7,
      4,
      4
    );


  const roofMaterial =
    new THREE.MeshStandardMaterial({
      color:0x8b4513
    });


  const roof =
    new THREE.Mesh(
      roofGeometry,
      roofMaterial
    );


  roof.position.y =
    7;


  roof.rotation.y =
    Math.PI / 4;


  roof.castShadow =
    true;


  group.add(
    roof
  );


  /*
    Door
  */

  const doorGeometry =
    new THREE.BoxGeometry(
      1.6,
      2.8,
      0.25
    );


  const doorMaterial =
    new THREE.MeshStandardMaterial({
      color:0x3b2415
    });


  const door =
    new THREE.Mesh(
      doorGeometry,
      doorMaterial
    );


  door.position.set(
    0,
    1.4,
    4.05
  );


  group.add(
    door
  );


  /*
    Windows
  */

  const windowGeometry =
    new THREE.BoxGeometry(
      1.5,
      1.4,
      0.2
    );


  const windowMaterial =
    new THREE.MeshStandardMaterial({
      color:0x9bdcff,
      metalness:0.1,
      roughness:0.2
    });


  const window1 =
    new THREE.Mesh(
      windowGeometry,
      windowMaterial
    );


  window1.position.set(
    -3,
    3,
    4.05
  );


  group.add(
    window1
  );


  const window2 =
    window1.clone();


  window2.position.x =
    3;


  group.add(
    window2
  );


  group.position.set(
    x,
    0,
    z
  );


  scene.add(
    group
  );

}


/* =========================================================
   VILLAGE HOUSES
========================================================= */

function createVillageHouses(){

  createHouse(
    -25,
    -20,
    0xe0b070
  );


  createHouse(
    -45,
    -20,
    0xd8c090
  );


  createHouse(
    25,
    -22,
    0xd89b72
  );


  createHouse(
    45,
    -22,
    0xe5c07b
  );


  createHouse(
    -25,
    20,
    0xcaa574
  );


  createHouse(
    25,
    20,

/* =========================================================

function setupKeyboard(){

}


/* =========================================================
   JOYSTICK
========================================================= */

function setupJoystick(){

  const joystick =
    getElement("joystick");

  const knob =
    getElement("joystickKnob");


  function updateJoystick(
    clientX,
    clientY
  ){

    const rect =
      joystick.getBoundingClientRect();


    const centerX =
      rect.left +
      rect.width / 2;


    const centerY =
      rect.top +
      rect.height / 2;


    let dx =
      clientX -
      centerX;


    let dy =
      clientY -
      centerY;


    const maxDistance =
      42;


    const distance =
      Math.sqrt(
        dx*dx +
        dy*dy
      );


    if(distance > maxDistance){

      dx =
        dx / distance *
        maxDistance;

      dy =
        dy / distance *
        maxDistance;

    }


    joystickX =
      dx / maxDistance;

    joystickY =
      dy / maxDistance;


    knob.style.transform =
      `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;

  }


  function resetJoystick(){

    joystickActive =
      false;

    joystickX =
      0;

    joystickY =
      0;


    knob.style.transform =
      "translate(-50%,-50%)";

  }


  joystick.addEventListener(
    "pointerdown",
    event => {

      joystickActive =
        true;

      joystick.setPointerCapture(
        event.pointerId
      );


      updateJoystick(
        event.clientX,
        event.clientY
      );

    }
  );


  joystick.addEventListener(
    "pointermove",
    event => {

      if(
        !joystickActive
      ){
        return;
      }


      updateJoystick(
        event.clientX,
        event.clientY
      );

    }
  );


  joystick.addEventListener(
    "pointerup",
    resetJoystick
  );


  joystick.addEventListener(
    "pointercancel",
    resetJoystick
  );

}


/* =========================================================
   PLAYER MOVEMENT
========================================================= */

function updatePlayer(
  delta
){

  if(!player){
    return;
  }


  let moveX =
    0;

  let moveZ =
    0;


  /*
    Keyboard
  */

  if(
    keys["w"] ||
    keys["arrowup"]
  ){

    moveZ -= 1;

  }


  if(
    keys["s"] ||
    keys["arrowdown"]
  ){

    moveZ += 1;

  }


  if(
    keys["a"] ||
    keys["arrowleft"]
  ){

    moveX -= 1;

  }


  if(
    keys["d"] ||
    keys["arrowright"]
  ){

    moveX += 1;

  }


  /*
    Mobile joystick
  */

  if(
    joystickActive
  ){

    moveX =
      joystickX;

    moveZ =
      joystickY;

  }


  const length =
    Math.sqrt(
      moveX*moveX +
      moveZ*moveZ
    );


  if(length > 0.05){

    moveX /=
      length;

    moveZ /=
      length;


    const speed =
      9;


    player.position.x +=
      moveX *
      speed *
      delta;


    player.position.z +=
      moveZ *
      speed *
      delta;


    /*
      Face movement direction
    */

    player.rotation.y =
      Math.atan2(
        moveX,
        moveZ
      );

  }


  /*
    World boundaries
  */

  player.position.x =
    THREE.MathUtils.clamp(
      player.position.x,
      -100,
      100
    );


  player.position.z =
    THREE.MathUtils.clamp(
      player.position.z,
      -100,
      100
    );


  updateCamera();

}


/* =========================================================
   CAMERA
========================================================= */

function updateCamera(){

  if(!player || !camera){
    return;
  }


  const distance =
    10;


  const height =
    7;


  const angle =
    cameraAngle;


  const targetX =
    player.position.x;


  const targetZ =
    player.position.z;


  camera.position.x =
    targetX +
    Math.sin(angle) *
    distance;


  camera.position.y =
    player.position.y +
    height;


  camera.position.z =
    targetZ +
    Math.cos(angle) *
    distance;


  camera.lookAt(
    player.position.x,
    player.position.y + 1.5,
    player.position.z
  );

}


/* =========================================================
   CAMERA CONTROLS
========================================================= */

function rotateCamera(
  direction
){

  cameraAngle +=
    direction *
    0.35;

  updateCamera();

}


function resetCamera(){

  cameraAngle =
    0;

  updateCamera();

}


/* =========================================================
   ANIMATION
========================================================= */

function animateWorld(){

  animationFrame =
    requestAnimationFrame(
      animateWorld
    );


  const delta =
    Math.min(
      clock.getDelta(),
      0.05
    );


  updatePlayer(
    delta
  );


  renderer.render(
    scene,
    camera
  );

}


/* =========================================================
   RESIZE
========================================================= */

function resizeWorld(){

  if(
    !camera ||
    !renderer
  ){
    return;
  }


  const world =
    getElement("gameWorld");


  camera.aspect =
    world.clientWidth /
    world.clientHeight;


  camera.updateProjectionMatrix();


  renderer.setSize(
    world.clientWidth,
    world.clientHeight,
    false
  );

}


/* =========================================================
   WORLD UI
========================================================= */

function updateWorldUI(){

  if(!currentPlayer){
    return;
  }


  getElement("worldPlayerName")
    .textContent =
    currentPlayer.name;


  getElement("worldMoney")
    .textContent =
    Number(
      currentPlayer.money || 0
    ).toLocaleString();

}


/* =========================================================
   STOP WORLD
========================================================= */

function stopVillageWorld(){

  if(animationFrame){

    cancelAnimationFrame(
      animationFrame
    );

    animationFrame =
      null;

  }


  worldStarted =
    false;


  if(renderer){

    renderer.dispose();

  }


  scene =
    null;

  camera =
    null;

  renderer =
    null;

  player =
    null;

}

========================================================= */

    if(

  }
);


/* =========================================================
   START
========================================================= */

async function startGame(){

  const {
    data
  } =
    await supabaseClient
      .auth
      .getSession();


  if(data.session){

    await loadPlayer();

  }else{

    showLogin();

  }

}
