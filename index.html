<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>LifeSim</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #0b1020;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      width: 92%;
      max-width: 520px;
      text-align: center;
      padding: 30px 20px;
    }

    .logo {
      font-size: 54px;
      font-weight: bold;
      letter-spacing: -2px;
      margin-bottom: 8px;
    }

    .tagline {
      color: #aab3c7;
      font-size: 17px;
      margin-bottom: 45px;
    }

    .card {
      background: #151c30;
      border: 1px solid #26304a;
      border-radius: 22px;
      padding: 28px 22px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
    }

    .card h2 {
      margin-top: 0;
      font-size: 25px;
    }

    .card p {
      color: #9da7bd;
      line-height: 1.6;
    }

    .start-btn {
      width: 100%;
      margin-top: 22px;
      padding: 16px;
      border: 0;
      border-radius: 13px;
      background: #ffffff;
      color: #0b1020;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .start-btn:active {
      transform: scale(0.98);
    }

    .features {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 22px;
    }

    .feature {
      background: #10172a;
      border-radius: 13px;
      padding: 15px 5px;
      font-size: 13px;
      color: #c5ccda;
    }

    .icon {
      display: block;
      font-size: 22px;
      margin-bottom: 7px;
    }

    .footer {
      margin-top: 28px;
      color: #667087;
      font-size: 12px;
    }

    @media (max-width: 380px) {
      .logo {
        font-size: 44px;
      }

      .features {
        gap: 6px;
      }

      .feature {
        font-size: 11px;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <div class="logo">
      LifeSim
    </div>

    <div class="tagline">
      Your Life. Your Choices.
    </div>

    <div class="card">

      <h2>Welcome to LifeSim</h2>

      <p>
        Build your own virtual life,
        make decisions, start a career,
        build a business and compete
        with players around the world.
      </p>

      <button class="start-btn" onclick="startGame()">
        🚀 Start Your Life
      </button>

      <div class="features">

        <div class="feature">
          <span class="icon">👤</span>
          Create
        </div>

        <div class="feature">
          <span class="icon">💰</span>
          Earn
        </div>

        <div class="feature">
          <span class="icon">🌍</span>
          Compete
        </div>

      </div>

    </div>

    <div class="footer">
      LifeSim • Virtual Life Simulator
    </div>

  </main>

  <script>
    function startGame() {
      alert("Your LifeSim journey is about to begin!");
    }
  </script>

</body>
</html>
