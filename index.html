<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>LifeSim</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #101522;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .box {
      width: 90%;
      max-width: 500px;
    }

    h1 {
      font-size: 48px;
      margin-bottom: 10px;
    }

    p {
      color: #b8c0d4;
      font-size: 18px;
    }

    button {
      margin-top: 25px;
      padding: 14px 30px;
      border: 0;
      border-radius: 10px;
      font-size: 17px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <div class="box">
    <h1>LifeSim</h1>

    <p>Your Life. Your Choices.</p>

    <button onclick="startGame()">
      Start Your Life
    </button>
  </div>

  <script>
    function startGame() {
      alert("Welcome to LifeSim!");
    }
  </script>

</body>
</html>
