/* =========================================================
   AUTH
========================================================= */

function showAuth(mode){

  const isSignup =
    mode === "signup";


  document.getElementById(
    "gameCard"
  ).innerHTML = `

    <h2>
      ${
        isSignup
        ? "🚀 Create Account"
        : "🔐 Login"
      }
    </h2>

    <p class="description">
      ${
        isSignup
        ? "Create your LifeSim account."
        : "Login to continue your LifeSim journey."
      }
    </p>

    <input
      id="authEmail"
      type="email"
      placeholder="Email address"
    >

    <input
      id="authPassword"
      type="password"
      placeholder="Password"
    >

    <button
      id="authButton"
      onclick="${
        isSignup
        ? "signup()"
        : "login()"
      }"
    >
      ${
        isSignup
        ? "✨ Create Account"
        : "🔓 Login"
      }
    </button>

    <div
      id="authMessage"

    <button
      class="back"

        isSignup

      ← ${
        isSignup

}


/* =========================================================
   SIGNUP
========================================================= */

async function signup(){

  const email =
    document.getElementById(
      "authEmail"
    ).value.trim();

  const password =
    document.getElementById(
      "authPassword"
    ).value;

  const message =
    document.getElementById(
      "authMessage"
    );

  const button =
    document.getElementById(
      "authButton"
    );


  if(!email || !password){

    message.className =
      "message error";

    message.textContent =
      "Please enter email and password.";

    return;
  }


  if(password.length < 6){

    message.className =
      "message error";

    message.textContent =
      "Password must be at least 6 characters.";

    return;
  }


  button.disabled = true;

  button.textContent =
    "Creating account...";


  const {
    data,
    error
  } =
    await supabaseClient.auth.signUp({

      email:email,

      password:password

    });


  if(error){

    button.disabled = false;

    button.textContent =
      "✨ Create Account";

    message.className =
      "message error";

    message.textContent =
      error.message;

    return;
  }


  if(data.user){

    currentUser =
      data.user;

    message.className =
      "message success";

    message.textContent =
      "Account created!";


    setTimeout(
      showCharacter,
      500
    );

  }

}


/* =========================================================
   LOGIN
========================================================= */

async function login(){

  const email =
    document.getElementById(
      "authEmail"

  const password =
    document.getElementById(
      "authPassword"
    ).value;

  const message =
    document.getElementById(
      "authMessage"
    );

  const button =
    document.getElementById(
      "authButton"

  if(!email || !password){

    message.className =
      "message error";

    message.textContent =
      "Please enter email and password.";

    return;
  }


  button.disabled = true;

  button.textContent =
    "Logging in...";


  const {
    data,
    error

    await supabaseClient.auth.signInWithPassword({

      email:email,

      password:password

  if(error){

    button.disabled = false;

    button.textContent =
      "🔓 Login";

    message.className =
      "message error";

    message.textContent =
      error.message;

    return;
  }


  currentUser =
    data.user;


  await loadPlayer();

}

/* =========================================================
   CREATE CHARACTER
========================================================= */

async function createCharacter(){

  if(!currentUser){

    showAuth("login");

    return;
  }


  const name =
    document.getElementById(
      "playerName"
    ).value.trim();

  const age =
    parseInt(
      document.getElementById(
        "playerAge"
      ).value
    );

  const city =
    document.getElementById(
      "playerCity"
    ).value.trim();

  const goal =
    document.getElementById(
      "playerGoal"
    ).value;


  const message =
    document.getElementById(
      "characterMessage"
    );

  const button =
    document.getElementById(
      "createButton"
    );


  if(!name || !age || !city || !goal){

    message.className =
      "message error";

    message.textContent =
      "Please complete all fields.";

    return;
  }


  if(age < 13 || age > 100){

    message.className =
      "message error";

    message.textContent =
      "Age must be between 13 and 100.";

    return;
  }


  button.disabled = true;

  button.textContent =
    "Saving...";


  const {
    data,
    error
  } =
    await supabaseClient
      .from("players")
      .insert({

        id:currentUser.id,

        name:name,

        age:age,

        city:city,

        goal:goal,

        money:10000,

        happiness:70,

        reputation:10,

        career:"Unemployed",

        experience:0,

        career_level:1

      })
      .select()
      .single();


  if(error){

    button.disabled = false;

    button.textContent =
      "✨ Create Character";


    if(error.code === "23505"){

      message.className =
        "message error";

      message.textContent =
        "Character already exists.";

      await loadPlayer();

      return;
    }


    message.className =
      "message error";

    message.textContent =
      error.message;

    return;
  }


  currentPlayer =
    data;


  showWelcome();

}


/* =========================================================
   LOAD PLAYER
========================================================= */

async function loadPlayer(){

  if(!currentUser){

    return;
  }


  const {
    data,
    error
  } =
    await supabaseClient
      .from("players")
      .select("*")
      .eq("id",currentUser.id)
      .maybeSingle();


  if(error){

    console.error(
      "Player load error:",
      error
    );

    return;
  }


  if(data){

    currentPlayer =
      data;

    showWelcome();

  }else{

    showCharacter();

  }

}

/* =========================================================
   CHOOSE CAREER
========================================================= */

async function chooseCareer(
  job,
  salary,
  xp
){

  if(!currentPlayer){

    return;
  }


  const newXP =
    Number(
      currentPlayer.experience || 0
    ) + Number(xp);


  let newLevel =
    Number(
      currentPlayer.career_level || 1
    );


  if(
    newXP >= newLevel * 50
  ){

    newLevel++;
  }


  const {
    data,
    error
  } =
    await supabaseClient
      .from("players")
      .update({

        career:job,

        experience:newXP,

        career_level:newLevel

      })
      .eq("id",currentUser.id)
      .select()
      .single();


  if(error){

    alert(
      "Could not save career: " +
      error.message
    );

    return;
  }


  currentPlayer =
    data;


  alert(
    "Career selected: " +
    job
  );


  showWorkScreen(
    job,
    salary,
    xp
  );

}

/* =========================================================
   WORK JOB
========================================================= */

async function workJob(
  salary,
  xp
){

  if(!currentPlayer){

    return;
  }


  const button =
    document.getElementById(
      "workButton"
    );


  if(button){

    button.disabled = true;

    button.textContent =
      "Working...";
  }


  const newMoney =
    Number(
      currentPlayer.money || 0
    ) + Number(salary);


  const newXP =
    Number(
      currentPlayer.experience || 0
    ) + Number(xp);


  let newLevel =
    Number(
      currentPlayer.career_level || 1
    );


  const requiredXP =
    newLevel * 50;


  if(newXP >= requiredXP){

    newLevel++;
  }


  let newHappiness =
    Number(
      currentPlayer.happiness || 70
    ) - 1;


  if(newHappiness < 0){

    newHappiness = 0;
  }


  const {
    data,
    error
  } =
    await supabaseClient
      .from("players")
      .update({

        money:newMoney,

        experience:newXP,

        career_level:newLevel,

        happiness:newHappiness

      })
      .eq("id",currentUser.id)
      .select()
      .single();


  if(error){

    if(button){

      button.disabled = false;

      button.textContent =
        "🕐 Work Now";
    }

    alert(
      "Work failed: " +
      error.message
    );

    return;
  }


  currentPlayer =
    data;


  alert(
    "💰 You earned $" +
    salary +
    " and gained +" +
    xp +
    " XP!"
  );


  showWorkScreen(
    currentPlayer.career,
    salary,
    xp
  );

}

    null;

  showHome();

}


/* =========================================================
   HTML SAFETY
========================================================= */

function escapeHTML(value){

  return String(value)
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}
